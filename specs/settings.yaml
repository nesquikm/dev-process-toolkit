schema_version: 1
min_dpt_version: 3.0.0
task_tracking:
  mode: linear
  mcp_server: linear
  jira_ac_field: ""
  linear:
    team: STE
    project: DPT — Dev Process Toolkit
  status_vocabulary:
    tracker_key: linear
    statuses:
      - Backlog
      - Todo
      - In Progress
      - Done
      - Canceled
      - Duplicate
    roles:
      initial: Backlog
      in_progress: In Progress
      in_review: In Progress
      done: Done
verification:
  verify_skill: smoke-test
  verify_mode: manual
  run_cmd: none
docs:
  user_facing_mode: false
  packages_mode: false
  changelog_ci_owned: false
  changelog_unversioned: false
orchestration:
  default_effort: ultracode
  merge_policy: auto
tracking:
  token_stats:
    enabled: true
retro:
  priority:
    - waste
    - tokens
    - time
release:
  files:
    - path: plugins/dev-process-toolkit/.claude-plugin/plugin.json
      kind: json
      field: version
    - path: .claude-plugin/marketplace.json
      kind: json
      field: plugins[0].version
    - path: CHANGELOG.md
      kind: changelog
    - path: README.md
      kind: regex
      pattern: "Latest: \\*\\*v(?<version>\\d+\\.\\d+\\.\\d+) — \"(?<codename>[^\"]+)\""
      replace: "Latest: **v{version} — \"{codename}\""
      optional: true
    - path: specs/requirements.md
      kind: regex
      pattern: \*\*Latest shipped release:\*\* \*\*v(?<version>\d+\.\d+\.\d+) \("(?<codename>[^"]+)"\)\*\*
      replace: "**Latest shipped release:** **v{version} (\"{codename}\")**"
video:
  config:
    tts:
      provider: elevenlabs
      voice: hpp4J3VqNfWAUOO0d1Us
      model: eleven_v4
    recorder:
      kind: command
      command:
        - bash
        - .dpt/video/scripts/record-shot.sh
    music:
      source: elevenlabs
  style:
    pacing:
      words_per_minute: 165
    captions:
      enabled: true
      position: bottom
    music:
      level_db: -18
      prompt: "High-energy modern electronic track for a playful developer-tool explainer: punchy drums, funky bass line, bright synth stabs, confident and fun, steady driving tempo, no vocals, never sleepy or elevator-like."
    narration:
      tone: "Positive, dynamic and funny: quick upbeat delivery, playful jokes about dev workflows and approval gates, genuine excitement at each reveal. Use [excited] and [laughs] sparingly, at punchlines only."
    banned_effects:
      - slow_zoom
      - ken_burns
    humor: playful
    layout:
      viewport:
        width: 1280
        height: 720
    loudness:
      target_lufs: -16
