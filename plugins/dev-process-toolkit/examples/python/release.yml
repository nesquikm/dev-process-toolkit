# Default `release.files` entries for a Python project, which /setup
# writes into specs/settings.yaml (on a legacy tree, the CLAUDE.md
# `## Release Files` block).
# `pyproject.toml` typically carries `[project] version = "x.y.z"`.
files:
  - path: pyproject.toml
    kind: toml
    field: project.version
  - path: CHANGELOG.md
    kind: changelog
  - path: README.md
    kind: regex
    pattern: 'Latest: \*\*v(?<version>\d+\.\d+\.\d+)\s*[—–-]\s*'
    replace: 'Latest: **v{version} — '
    optional: true
