# Default `release.files` entries for a TypeScript / Node project, which /setup
# writes into specs/settings.yaml (on a legacy tree, the CLAUDE.md
# `## Release Files` block). Reach for `kind: regex`
# if your README "Latest:" line uses a non-standard shape.
files:
  - path: package.json
    kind: json
    field: version
  - path: CHANGELOG.md
    kind: changelog
  - path: README.md
    kind: regex
    pattern: 'Latest: \*\*v(?<version>\d+\.\d+\.\d+)\s*[—–-]\s*'
    replace: 'Latest: **v{version} — '
    optional: true
