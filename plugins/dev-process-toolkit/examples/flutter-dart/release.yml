# Default `release.files` entries for a Flutter / Dart project, which /setup
# writes into specs/settings.yaml (on a legacy tree, the CLAUDE.md
# `## Release Files` block).
# `pubspec.yaml` versions carry an optional `+<build>` suffix; the yaml
# bumper preserves it on rewrite.
files:
  - path: pubspec.yaml
    kind: yaml
    field: version
  - path: CHANGELOG.md
    kind: changelog
  - path: README.md
    kind: regex
    pattern: 'Latest: \*\*v(?<version>\d+\.\d+\.\d+)\s*[—–-]\s*'
    replace: 'Latest: **v{version} — '
    optional: true
