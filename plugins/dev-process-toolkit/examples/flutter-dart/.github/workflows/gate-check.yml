name: Gate Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # `make codegen` runs before analysis for the same reason it does
      # locally: generated sources have to exist before anything reads them.
      - name: Codegen
        run: make codegen

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
